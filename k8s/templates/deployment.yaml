{{- range .Values.targets }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-agent-ad-{{ .name }}
  labels:
    app.kubernetes.io/name: arc-agent-ad
    app.kubernetes.io/component: agent
    app.kubernetes.io/instance: {{ .name }}
spec:
  replicas: {{ .replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: arc-agent-ad
      app.kubernetes.io/instance: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arc-agent-ad
        app.kubernetes.io/instance: {{ .name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: arc-agent-ad
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.kafka.bootstrapServers | quote }}
            - name: ARC_TOPICS_PROVISIONING_IDENTITY
              value: {{ $.Values.kafka.topics.identity | quote }}
            - name: ARC_TOPICS_PROVISIONING_ASSIGNMENT
              value: {{ $.Values.kafka.topics.assignment | quote }}
            - name: ARC_TOPICS_PROVISIONING_ENTITLEMENT
              value: {{ $.Values.kafka.topics.entitlement | quote }}
            - name: AD_URL
              value: {{ $.Values.ad.url | quote }}
            - name: AD_BASE_DN
              value: {{ $.Values.ad.baseDn | quote }}
            - name: AD_BIND_DN
              value: {{ $.Values.ad.bindDn | quote }}
            - name: AD_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arc-agent-ad-secret
                  key: AD_BIND_PASSWORD
            - name: AD_USERS_OU
              value: {{ $.Values.ad.usersOu | quote }}
            - name: AD_TIER0_OU
              value: {{ $.Values.ad.tier0Ou | quote }}
            - name: AD_TIER1_OU
              value: {{ $.Values.ad.tier1Ou | quote }}
            - name: AD_TIER2_OU
              value: {{ $.Values.ad.tier2Ou | quote }}
            - name: TARGET_SYSTEM
              value: {{ .targetSystem | quote }}
            - name: ARC_AGENT_CONSUMER_GROUP
              value: {{ .consumerGroup | quote }}
            - name: ARC_AGENT_DRY_RUN
              value: {{ $.Values.agent.dryRun | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
{{- end }}
