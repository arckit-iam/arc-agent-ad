---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-agent-ad
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s
      sourceRef:
        kind: GitRepository
        name: arcagentad
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/arckit-iam/arc-agent-ad
      tag: "0.1.0-dev"
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ghcr
    kafka:
      bootstrapServers: "redpanda-external.arckit.svc.cluster.local:9092"
      topics: "arc.provisioning"
    agent:
      dryRun: true
    targets:
      - name: ad01
        targetSystem: ad://AD01
        consumerGroup: arc-agent-ad-ad01
        replicaCount: 1
      - name: ad02
        targetSystem: ad://AD02
        consumerGroup: arc-agent-ad-ad02
        replicaCount: 1
