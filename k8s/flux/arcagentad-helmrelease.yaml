---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-agent-ad
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s
      sourceRef:
        kind: GitRepository
        name: arcagentad
        namespace: flux-system
  values:
    image:
      tag: "0.1.12-dev"
    ad:
      url: "ldaps://dc01.iap.local:636"
      baseDn: "DC=iap,DC=local"
      bindDn: "CN=svc-arc,OU=Users,OU=Tier0,DC=iap,DC=local"
      usersOu: "OU=Users,OU=Tier1,DC=iap,DC=local"
      tier0Ou: "OU=Groups,OU=Tier0,DC=iap,DC=local"
      tier1Ou: "OU=Groups,OU=Tier1,DC=iap,DC=local"
      tier2Ou: "OU=Groups,OU=Tier2,DC=iap,DC=local"
    kafka:
      bootstrapServers: redpanda-external.arckit.svc.cluster.local:9092
      topics:
        identity: arc.provisioning.identity
        assignment: arc.provisioning.assignment
        entitlement: arc.provisioning.entitlement
    agent:
      dryRun: false
    targets:
      - name: ad01
        targetSystem: ad://DC01
        consumerGroup: arc-agent-ad-dc01
        replicaCount: 1
    hostAliases:
      - ip: "5.196.15.140"
        hostnames:
          - "dc01.iap.local"
