spring:
  application:
    name: arc-agent-ad
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${ARC_AGENT_CONSUMER_GROUP:arc-agent-ad}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

arc:
  agent:
    target-system: ${TARGET_SYSTEM:ad://AD01}
    dry-run: ${ARC_AGENT_DRY_RUN:true}
    topics:
      identity: ${ARC_TOPICS_PROVISIONING_IDENTITY:arc.provisioning.identity}
      assignment: ${ARC_TOPICS_PROVISIONING_ASSIGNMENT:arc.provisioning.assignment}
      entitlement: ${ARC_TOPICS_PROVISIONING_ENTITLEMENT:arc.provisioning.entitlement}
    ad:
      url: ${AD_URL:ldaps://localhost:636}
      base-dn: ${AD_BASE_DN}
      bind-dn: ${AD_BIND_DN}
      bind-password: ${AD_BIND_PASSWORD}
      users-ou: ${AD_USERS_OU:}
      # Type de compte -> OU cible. Les managers n'envoient que le type (standard, admin...).
      account-type-ous:
        standard: ${AD_ACCOUNT_TYPE_STANDARD_OU:}
        admin: ${AD_ACCOUNT_TYPE_ADMIN_OU:}
        service-account: ${AD_ACCOUNT_TYPE_SERVICE_ACCOUNT_OU:}
      tier0-ou: ${AD_TIER0_OU}
      tier1-ou: ${AD_TIER1_OU}
      tier2-ou: ${AD_TIER2_OU}

logging:
  level:
    com.instantaccessprovider.arcagentad: INFO
